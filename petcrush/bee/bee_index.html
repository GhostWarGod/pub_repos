<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<title>Crypto Pet Crush</title>
	<link type="text/css" rel="stylesheet" href="https://game002.bee.com/game-bee/status/css/base.css?v3">
	<script src="https://game002.bee.com/game-bee/status/js/jquery-min.js?v250411"></script>
	<!--cp广告-->
	<script async="" crossorigin="anonymous"
		src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3424102604992913"></script>
	<script>
		window.adsbygoogle = window.adsbygoogle || [];
		var adBreak = adConfig = function (o) { adsbygoogle.push(o) }
		adConfig({ preloadAdBreaks: 'on' }); //广告预加载
	</script>
	<script>
		const search = window.location.search;
		var gamesrc = 'https://snake.cryptoarena.io/' + search;
	</script>
	<script src="https://cdn.bootcdn.net/ajax/libs/vConsole/3.3.4/vconsole.min.js"></script>
	<script>
		// 初始化
		new VConsole();
	</script>
</head>

<body>
	<div id="page">
		<iframe style="position: absolute" allowfullscreen="true" id="gameframe" name="gameframe" src="" frameborder="0"
			width="100%" height="100%"></iframe>
	</div>

	<div class="bottom-div">
		<script async="" crossorigin="anonymous"
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3424102604992913"></script>
		<!-- 底部320*50贴片广告 -->
		<ins class="adsbygoogle" data-ad-client="ca-pub-3424102604992913" data-ad-slot="2199356140"
			style="display:inline-block;width:320px;height:50px"></ins>
		<script>
			(adsbygoogle = window.adsbygoogle || []).push({});
		</script>
	</div>

	<script>
		$(function () {
			var gameframe = document.getElementById('gameframe').contentWindow

			// 封装“start”/“reward”类型广告示例，其他还有“preroll”/“pause”/ “next”/“browse”
			// 调用触发插屏广告
			function showTableAd() {
				adBreak({
					type: 'start',	//广告类别，start位置的插⻚广告
					name: 'game_started',	//这个位置的描述性名称
					beforeAd: () => { },	//准备广告。静音和暂停游戏流程
					afterAd: () => { },	//恢复游戏和取消静音的声音
					adBreakDone: (placementInfo) => { }, //即使没有广告也会调用(如果有的话)
				})
			}

			// 调用触发激励广告
			function showRewardAdGoogle(cb = null) {
				adBreak({
					type: 'reward',	//广告类别，激励广告
					name: 'new_life_reward_2',	//此位置的描述性名称
					beforeAd: () => { console.log("为广告做准备。静音和暂停游戏程流") },
					afterAd: () => { }, //恢复游戏并重新启用声音
					beforeReward: (showAdFn) => { showAdFn() },	//显示奖励提示(如果点击，调用showAdFn())
					adDismissed: () => {
						console.log("玩家在⼴告完成前拒绝了⼴告")
						gameframe.postMessage({
							type: 'onClose',
							data: { isEnd: false, custom: window.adParams },
						}, "*")
					},
					adViewed: () => {
						console.log("激励奖励回调")
						gameframe.postMessage({
							type: 'onClose',
							data: { isEnd: true, custom: window.adParams },
						}, "*")
					},	//广告被查看后关闭
					adBreakDone: (placementInfo) => {
						if (placementInfo.breakStatus != "viewed") {
							console.log("即使没有⼴告也会调⽤", placementInfo)
						}
					},
				})
			}

			var iframeGame = document.getElementById('gameframe')
			iframeGame.src = gamesrc
			setTimeout(function () {
				showTableAd()
			}, 2000)
		})
	</script>
</body>

</html>
